<body>
  <main id="game">
    <header>
      <h1>CLAY DAVIS</h1>
      <div class="clock">
        <div id="time">0.00</div>
        <div class="best">BEST <span id="best">0.00</span></div>
      </div>
    </header>

    <div id="stage">
      <canvas id="screen" width="960" height="520" role="img" aria-label="Senator Clay Davis"></canvas>
      <div id="prompt" aria-live="polite">LOADING…</div>
    </div>

    <div id="word" aria-hidden="true"><span id="letters">SH</span></div>

    <div class="meter" aria-label="Breath meter">
      <span>BREATH</span>
      <div class="track"><div id="fill"></div></div>
    </div>

    <div class="pads">
      <button type="button" class="pad" data-side="0" aria-label="Left button">
        <b>A</b><small>← or A</small>
      </button>
      <button type="button" class="pad" data-side="1" aria-label="Right button">
        <b>B</b><small>→ or L</small>
      </button>
    </div>

    <footer>Unofficial fan project. Not affiliated with HBO.</footer>
  </main>

  <div id="results" hidden>
    <div class="panel" role="dialog" aria-modal="true" aria-labelledby="verdict">
      <p class="label">YOU HELD IT FOR</p>
      <p id="final">0.00s</p>
      <h2 id="verdict"></h2>
      <p id="note"></p>
      <img id="card" alt="Your score card">
      <button type="button" id="share" class="primary">SHARE IT</button>
      <div class="links">
        <a id="toX" target="_blank" rel="noopener">X</a>
        <a id="toBsky" target="_blank" rel="noopener">BLUESKY</a>
        <a id="toFb" target="_blank" rel="noopener">FACEBOOK</a>
        <button type="button" id="copy">COPY</button>
        <a id="save" download="sheeeit.jpg">SAVE PIC</a>
      </div>
      <button type="button" id="again" class="primary alt">RUN IT BACK</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
