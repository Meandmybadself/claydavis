name = "claydavis-api"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Send /api/* on the site's own hostname to this Worker. The DNS record for the
# site must be proxied (orange cloud) for routes to apply.
routes = [{ pattern = "claydavis.meandmybadself.com/api/*", zone_name = "meandmybadself.com" }]

[[d1_databases]]
binding = "DB"
database_name = "claydavis"
database_id = "70459568-de5a-4a7d-b47a-fde8848a3b61"

[vars]
# Browsers allowed to call the API cross-origin (same-origin calls need nothing).
ALLOWED_ORIGINS = "https://claydavis.meandmybadself.com"

# Secrets, set with `wrangler secret put`:
#   SIGNING_SECRET    required, any long random string
#   TURNSTILE_SECRET  optional, turns on the bot challenge
